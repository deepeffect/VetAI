<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetAI — Evcil Hayvan Semptom Ön Değerlendirme</title>
    <meta
      name="description"
      content="Makine öğrenmesi ve Gemini destekli evcil hayvan semptom ön değerlendirme asistanı."
    />
    <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171f1b" media="(prefers-color-scheme: dark)" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235a8d71'%3E%3Cellipse cx='8' cy='7' rx='2.1' ry='2.8'/%3E%3Cellipse cx='16' cy='7' rx='2.1' ry='2.8'/%3E%3Cellipse cx='4.4' cy='12.4' rx='1.9' ry='2.4'/%3E%3Cellipse cx='19.6' cy='12.4' rx='1.9' ry='2.4'/%3E%3Cpath d='M12 12.6c2.9 0 5.6 2.4 5.6 4.9 0 1.9-1.5 3-3.4 3-1 0-1.6-.4-2.2-.4s-1.2.4-2.2.4c-1.9 0-3.4-1.1-3.4-3 0-2.5 2.7-4.9 5.6-4.9Z'/%3E%3C/svg%3E"
    />

    <!-- Inter: Türkçe karakterleri (ı, ş, ğ, ç, ö, ü, â) eksiksiz destekler.
         Bağlantı yoksa aşağıdaki sistem font yığınına düşer. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Tema, React yüklenmeden uygulanır; böylece açılışta beyaz/siyah sıçrama olmaz. -->
    <script>
      (function () {
        try {
          // Varsayilan acik tema; koyu tema yalnizca kullanici sectiyse.
          var secim = localStorage.getItem("vetai-tema");
          document.documentElement.classList.toggle("dark", secim === "koyu");
        } catch (e) {
          /* localStorage kapalıysa açık tema ile devam et */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
